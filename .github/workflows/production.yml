name: Production check

# The hub can change what it serves without a change here, so this runs every night.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  production:
    name: Released clients and served data
    # Don't burn scheduled runs on forks.
    if: github.event_name != 'schedule' || github.repository == 'NeverBlink-OSS/ohi'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Relocate the coursier archive cache # see checks.yml
        run: echo "COURSIER_ARCHIVE_CACHE=${{ runner.temp }}/cs-arc" >> "$GITHUB_ENV"

      - name: Cache dependencies
        uses: coursier/cache-action@v8
        with:
          extraFiles: '["**/package.mill", "mill-build/src/**/*.scala", "!out/**", "!.bsp/**"]'

      - name: Setup JVM
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Check production
        run: bash cli/check-production.sh
