id: https://ohi.neverblink.eu/contracts/domains
name: ohi_domains
title: Domain list
description: The domains a publication can have, with their groups, as the Hub serves them.
status: draft
prefixes:
  ohi: https://ohi.neverblink.eu/contracts/
  linkml: https://w3id.org/linkml/
default_prefix: ohi
imports:
- linkml:types
classes:
  DomainList:
    description: Every domain and domain group of the Hub. Publications and search hits hold only domain ids; their metadata is here.
    comments:
    - A domain or group is never removed and its id never changes, so every id is always resolved. Other domain metadata can change.
    - The order of each list is the Hub's display order.
    - Fields can be added. Breaking changes are versioned.
    tree_root: true
    extra_slots:
      allowed: true
    attributes:
      groups:
        description: The groups of domains.
        range: DomainGroup
        required: true
        multivalued: true
        inlined_as_list: true
      domains:
        description: The domains.
        range: Domain
        required: true
        multivalued: true
        inlined_as_list: true
  Domain:
    description: A thematic area of an ontology.
    extra_slots:
      allowed: true
    attributes:
      id:
        description: Permanent identifier of the domain, such as health-and-medicine.
        range: string
        required: true
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*(?![\s\S])
      title:
        description: Display name of the domain.
        range: string
        required: true
        pattern: ^[\s\S]*\S
      description:
        description: What the domain covers.
        range: string
        pattern: ^[\s\S]*\S
      group:
        description: Id of the group the domain belongs to. Absent on a domain in no group.
        range: string
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*(?![\s\S])
      deprecated:
        description: Why the domain is retired, such as "Use health-and-medicine". New publications can't
          use it; old publications that use it keep it. Absent on nondeprecated domains.
        range: string
        pattern: ^[\s\S]*\S
  DomainGroup:
    description: A group of domains.
    extra_slots:
      allowed: true
    attributes:
      id:
        description: Permanent identifier of the group, such as life-sciences.
        range: string
        required: true
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*(?![\s\S])
      title:
        description: Display name of the group.
        range: string
        required: true
        pattern: ^[\s\S]*\S
      description:
        description: What the group covers.
        range: string
        pattern: ^[\s\S]*\S
