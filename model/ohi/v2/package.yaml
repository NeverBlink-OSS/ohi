id: https://ohi.neverblink.eu/contracts/package
name: ohi_package
title: Publication metadata
description: Metadata for one immutable ontology release, its artifacts and its dependencies.
status: draft
prefixes:
  ohi: https://ohi.neverblink.eu/contracts/
  linkml: https://w3id.org/linkml/
default_prefix: ohi
imports:
  - publication-fields
classes:
  Publication:
    description: One immutable release of one ontology, including its metadata, artifacts and dependencies.
      Package, publication and release refer to the same entity.
    tree_root: true
    extra_slots:
      allowed: true
    slots:
      - base_url
      - namespace
      - name
      - version
      - title
      - description
      - licenses
      - published_at
      - hub_version
      - keywords
      - domains
      - element_count
      - native_element_count
      - authors
      - publishers
      - contributors
      - maintainers
      - original_sources
      - publications
    attributes:
      schema_version:
        description: Metadata contract revision, independent of the ontology's version.
        range: integer
        required: true
        minimum_value: 2
        maximum_value: 2
      publisher:
        description: Deprecated, use `publishers`. Name of the upstream person or organization responsible
          for publishing the ontology. Not inferred from catalog namespace.
        deprecated: Use `publishers`.
        range: string
        required: true
        pattern: ^[\s\S]*\S
      namespace_iri:
        description: Optional preferred primary RDF term namespace. Preserve the complete value including
          any trailing delimiter. Not the catalog namespace and not necessarily the ontology IRI.
        range: uri
      preferred_prefix:
        description: Optional abbreviation for namespace_iri, without whitespace or a colon. Requires
          namespace_iri. This constraint does not certify prefix syntax for every ontology language.
        range: string
        required: false
        pattern: ^[^\s:]+(?![\s\S])
      artifacts:
        description: Available artifacts of this ontology. Each artifact URL occurs once. Multiple artifacts
          may share a format.
        range: Artifact
        required: true
        multivalued: true
        minimum_cardinality: 1
        inlined: true
        inlined_as_list: true
      dependencies:
        description: Complete set of direct and indirect runtime dependency publications, excluding this
          publication. Each base_url occurs once. An empty list means this publication has no runtime
          dependencies.
        range: Dependency
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      revision:
        description: Revision information about this Publication, if it has any
        range: RevisionInfo
        inlined: true
      license_files:
        description: Links to files with the licensing/copyright text.
        range: uri
        multivalued: true
        notes:
          - Immutable api.ohi.dev link
      provenance:
        description: Provenance information about this Publication, if it has any
        range: Provenance
        inlined: true
  Artifact:
    description: Ontology content in a declared format, with explicitly identified entry files.
    extra_slots:
      allowed: true
    slots:
      - format
      - url
      - sha256
    attributes:
      origin:
        description: Origin of the artifact content.
        range: ArtifactOrigin
        required: true
      roots:
        description: Permanent absolute URLs of the entry files from which this artifact's ontology is
          loaded.
        range: uri
        required: true
        multivalued: true
        minimum_cardinality: 1
        list_elements_ordered: true
      size_bytes:
        description: Byte length of the final immutable artifact file, before HTTP content encoding. Measured
          from the same bytes as sha256.
        range: integer
        required: true
        minimum_value: 0
    slot_usage:
      sha256:
        required: true
  Dependency:
    description: A reference to an exact immutable publication required by this publication.
    extra_slots:
      allowed: true
    slots:
      - base_url
  Provenance:
    description: Provenance of the files
    extra_slots:
      allowed: true
    attributes:
      remote:
        range: RemoteFile
        inlined: true
        inlined_as_list: true
        multivalued: true
      index:
        range: IndexFile
        inlined: true
        inlined_as_list: true
        multivalued: true
      patched:
        range: PatchedFile
        inlined: true
        inlined_as_list: true
        multivalued: true
      generated:
        range: GeneratedFile
        inlined: true
        inlined_as_list: true
        multivalued: true

  File:
    description: File that is part of this publication
    abstract: true
    slots:
      - url

  RemoteFile:
    description: File that was fetched from a remote source
    extra_slots:
      allowed: true
    is_a: File
    attributes:
      from:
        description: The URI that was queried for the file
        range: uri
        required: true

  IndexFile:
    description: File that was fetched from the ohi-index repository directly
    extra_slots:
      allowed: true
    is_a: File
    attributes:
      commit:
        description: Commit sha of ohi-index the package was read at
        range: string
        required: true
      path:
        description: Path to the file in the repository.
        range: string
        required: true

  PatchedFile:
    description: File which was created by patching another
    extra_slots:
      allowed: true
    is_a: File
    attributes:
      from:
        description: The input file for this patch
        range: uri
        notes:
          - Immutable api.ohi.dev link
        required: true
      converted_line_endings:
        description: True if the line endings were converted from CRLF to LF.
        range: boolean
      added_base_iri:
        description: The base IRI, if it was patched in.
        range: uri
      json_patch:
        description: The base url of the JSON-Patch file, if the ontology was patched this way.
        range: uri
        notes:
          - Immutable api.ohi.dev link

  GeneratedFile:
    description: File that was generated from a remote source
    extra_slots:
      allowed: true
    is_a: File
    attributes:
      source:
        description: The input file for this conversion
        range: uri
        notes:
          - Immutable api.ohi.dev link
        required: true
      using:
        description: Tool that was used for the conversion
        range: string
        required: true

  RevisionInfo:
    description: Information about the revision
    comments:
      - >-
        Revisions use version tags of the form "{original_version}-revision-{id}",
        for example: v1.2.3-revision-2026-12-31
    notes:
      - This will include more information in the future
    extra_slots:
      allowed: true
    attributes:
      id:
        description: An identifier of the revision, added as a suffix to the version
        notes:
          - This should be an ISO-format date, for example 2026-12-31
        range: string
        required: true
      original_version:
        description: Original version of the ontology, prefix of the full version
        range: string
        required: true
      revises:
        description: base_uri of the revised ontology
        notes:
          - This should form a chain back to the first version (without revisions)
        range: uri
        required: true
      reason:
        description: Reason why this revision was created
        range: string
enums:
  ArtifactOrigin:
    description: Origin of published artifact content.
    permissible_values:
      UPSTREAM:
        description: File bytes preserved from the upstream publisher.
      GENERATED:
        description: File produced from source ontology content by conversion, import rewriting or other
          transformations.
