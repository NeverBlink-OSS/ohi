id: https://ohi.neverblink.eu/contracts/publication-fields
name: ohi_publication_fields
title: Publication fields and formats
description: Ontology publication fields and artifact formats.
status: draft
prefixes:
  ohi: https://ohi.neverblink.eu/contracts/
  linkml: https://w3id.org/linkml/
default_prefix: ohi
imports:
- linkml:types
slots:
  base_url:
    description: Permanent absolute URL identifying one exact immutable publication. GET this exact URL
      returns its publication JSON. Do not append a filename.
    range: uri
    required: true
  url:
    description: Permanent absolute download URL of an immutable ontology file.
    range: uri
    required: true
  format:
    description: Ontology language and syntax of the artifact.
    range: Format
    required: true
  namespace:
    description: Namespace qualifying the ontology name, such as w3c in w3c/prov-o.
    range: string
    required: true
    pattern: ^[\s\S]*\S
  name:
    description: Short catalog identifier, qualified by namespace. The namespace/name pair identifies
      the same ontology across releases.
    range: string
    required: true
    pattern: ^[\s\S]*\S
  version:
    description: Complete publication version label, including amendments.
    range: string
    required: true
    pattern: ^[\s\S]*\S
  title:
    description: Display title of the ontology.
    range: string
    required: true
    pattern: ^[\s\S]*\S
  description:
    description: Short description of the ontology's domain and intended use.
    range: string
    required: true
    pattern: ^[\s\S]*\S
  licenses:
    description: Reported license names or standard identifiers such as Apache-2.0. Empty means no
      information supplied. The list specifies neither AND nor OR combination semantics.
    range: string
    required: true
    pattern: ^[\s\S]*\S
    multivalued: true
  keywords:
    description: Keywords describing the ontology's subject. An empty list means no keywords are
      provided.
    range: string
    required: true
    multivalued: true
  published_at:
    description: First successful Hub publication time for this immutable release. Backend emits UTC
      date-time text with Z. Consumers accept timezone-bearing RFC 3339 text. Fixed for the lifetime
      of this publication. Not an upstream release date.
    range: datetime
    required: true
  element_count:
    description: Number of LinkML elements in the publication.
    comments:
    - For ontologies that are not natively LinkML, this is the count after importing them into
      LinkML.
    range: integer
    minimum_value: 0
  native_element_count:
    description: Number of elements in the publication's native format, as published upstream,
      such as the classes and properties of an OWL ontology.
    comments:
    - Counted before any conversion, so it can differ from element_count.
    range: integer
    minimum_value: 0
  authors:
    description: The people or organizations that made the ontology.
    range: Agent
    required: true
    multivalued: true
    minimum_cardinality: 1
    inlined: true
    inlined_as_list: true
  publishers:
    description: The people or organizations that publish the ontology upstream.
    range: Agent
    required: true
    multivalued: true
    minimum_cardinality: 1
    inlined: true
    inlined_as_list: true
  contributors:
    description: The people or organizations that contributed to the ontology.
    range: Agent
    multivalued: true
    inlined: true
    inlined_as_list: true
  maintainers:
    description: The third-party people or organizations that maintain the ontology in the ohi index.
    range: Agent
    multivalued: true
    inlined: true
    inlined_as_list: true
  original_sources:
    description: Upstream official sources of the ontology, such as its homepage or repository.
    range: uri
    required: true
    multivalued: true
    minimum_cardinality: 1
  publications:
    description: Papers that introduce or describe the ontology.
    range: Citation
    multivalued: true
    inlined: true
    inlined_as_list: true
  sha256:
    description: SHA-256 of the file bytes before HTTP content encoding.
    range: string
    pattern: ^[0-9a-f]{64}(?![\s\S])
classes:
  Agent:
    description: A person or organization involved with an ontology.
    extra_slots:
      allowed: true
    attributes:
      name:
        description: Name of the person or organization.
        range: string
        required: true
        pattern: ^[\s\S]*\S
      contact:
        description: How to reach them, such as an email address.
        range: string
        pattern: ^[\s\S]*\S
      link:
        description: A web page about them, such as a homepage or a profile.
        range: uri
  Citation:
    description: A paper that introduces or describes an ontology.
    extra_slots:
      allowed: true
    attributes:
      title:
        description: Title of the paper, or its full citation.
        range: string
        required: true
        pattern: ^[\s\S]*\S
      link:
        description: A web page about the paper, such as its DOI.
        range: uri
enums:
  Format:
    description: A combination of ontology language and syntax.
    permissible_values:
      owl-turtle:
        description: OWL in Turtle syntax.
      owl-rdfxml:
        description: OWL in RDF/XML syntax.
      rdfs-turtle:
        description: RDFS in Turtle syntax.
      linkml-yaml:
        description: LinkML in YAML syntax.
      ossie-yaml:
        description: Apache Ossie in YAML syntax.
      shacl-turtle:
        description: SHACL shapes in Turtle syntax.
