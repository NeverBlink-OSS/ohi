id: https://linkml.ohi.dev/model/converter/generator/rust
name: rust-generator
prefixes:
  converter: https://linkml.ohi.dev/model/converter#
default_prefix: converter
imports:
  - ../shared

classes:
  RustGeneratorOptions:
    description: Options of the Rust generator.
    attributes:
      crate_name:
        examples:
          - value: prov
        range: string
        description: >-
          The name of the crate and of its Python module. It must be a Rust identifier. If unset,
          the schema's name is used, with every character that can't be in an identifier
          replaced by `_`.
      serde:
        range: boolean
        required: true
        ifabsent: 'false'
        description: >-
          Whether the `serde` feature of the crate is on by default. The code for it is always
          generated.
      pyo3:
        range: boolean
        required: true
        ifabsent: 'false'
        description: >-
          Whether the `pyo3` feature of the crate is on by default, and the crate is a Python
          extension module with a `#[pymodule]` function. The PyO3 code of the classes is always
          generated.
      stubgen:
        range: boolean
        required: true
        ifabsent: 'true'
        description: >-
          Whether to generate the code for Python type stubs, behind the `stubgen` feature, and
          the `stub_gen` program that writes them.
      handwritten_lib:
        range: boolean
        required: true
        ifabsent: 'false'
        description: >-
          Whether to put the generated code in `src/generated/`, and leave `src/lib.rs` for code
          of your own. `src/lib.rs` is only written when it doesn't exist yet.
      expand_subproperty_of:
        range: boolean
        required: true
        ifabsent: 'true'
        description: >-
          Whether the type of a slot with `subproperty_of: X` is an enum with a variant for `X`
          and for each descendant of `X`. Otherwise, its type is the Rust type of its range.

functions:
  rust:
    description: >-
      Generate a Rust crate with a struct for each class and an enum for each enum, with serde
      and PyO3 support behind Cargo features. The files are `Cargo.toml`, `pyproject.toml` and
      the sources in `src/`.
    parameters: RustGeneratorOptions
    returns: Files
