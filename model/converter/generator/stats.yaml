id: https://linkml.ohi.dev/model/converter/generator/stats
name: stats-generator
prefixes:
  converter: https://linkml.ohi.dev/model/converter#
default_prefix: converter
imports:
  - ../shared

classes:
  StatsGeneratorOptions:
    description: Options of the schema statistics generator.
    mixins: [PruningOptions]
    slots:
      - only_classes_from_root_schema
    slot_usage:
      only_classes_from_root_schema:
        examples:
          - value: false
        ifabsent: 'true'
        description: >-
          Whether to count only the elements the root schema defines. Otherwise the counts also
          cover every element of every imported schema.
      pruning_mode:
        ifabsent: PruningMode(schema)
        deprecated: Ignored. Use `only_classes_from_root_schema` instead.
        description: >-
          Ignored, and kept only so existing calls still work. Use
          `only_classes_from_root_schema` instead.
      tree_root:
        deprecated: Ignored. Use `only_classes_from_root_schema` instead.
        description: >-
          Ignored, and kept only so existing calls still work. Use
          `only_classes_from_root_schema` instead.

functions:
  stats:
    description: >-
      Count the elements, their documentation, mappings and languages, and the imports. Returns a
      `SchemaStats` of `model/schema-stats.yaml`.
    parameters: StatsGeneratorOptions
    returns: Any
